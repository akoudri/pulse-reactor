spring:
  application:
    name: pulse-mvc-loom
  threads:
    virtual:
      enabled: true   # thread-per-request servlet sur virtual threads (Loom)

server:
  port: 8081

# Mêmes upstreams que le jumeau réactif (contrat identique pour le différentiel).
pulse:
  upstream:
    base-url: http://localhost:8089
    endpoints:
      - name: fast
        path: /health/fast
      - name: slow
        path: /health/slow
      - name: unstable
        path: /health/unstable
