# Pulse — infra de lab. Profils : on ne lance que ce dont le lab a besoin.
#   J1            : rien (flux purs)
#   J2 (PM)       : --profile upstream            (fan-out / hedging / circuit breaker)
#   J3 (AM)       : --profile data                (R2DBC Postgres, + mongo optionnel)
#   J3 (PM) / J4  : --profile data --profile streaming --profile upstream
#
# Exemples :
#   docker compose --profile data up -d
#   docker compose --profile data --profile streaming --profile upstream up -d

services:

  postgres:
    image: postgres:17
    profiles: ["data"]
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optionnel : démo "Mongo Reactive" en J3. Profil dédié pour ne pas l'imposer.
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka en mode KRaft (pas de Zookeeper). Bridgé vers Flux via spring-kafka.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Simulateur d'upstreams instables : latence, erreurs 5xx, pour le fan-out/fan-in,
  # le hedging, le circuit breaker et les timeouts WebClient.
  upstream-sim:
    image: wiremock/wiremock:latest
    profiles: ["upstream"]
    ports:
      - "8089:8080"
    command: ["--global-response-templating", "--verbose"]
    # Monte des stubs (latence, faults) depuis ./upstream-sim/ une fois créés en J2.
    volumes:
      - ./upstream-sim:/home/wiremock:ro
